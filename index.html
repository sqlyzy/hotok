<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HoTok</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HoTok">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #0d0d0d; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .splash-container {
            padding: 20px;
        }
        .logo-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: #1a1a1a;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .logo-placeholder img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
        p { font-size: 15px; color: #a0a0a0; max-width: 280px; margin: 0 auto 30px; line-height: 1.4; }
        .btn-install {
            background-color: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(255,255,255,0.2);
        }
        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            margin: 20px auto 0;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splash">
        <div class="logo-placeholder">
            <!-- Сюда подтянется твоя иконка с хомяком -->
            <img src="icon.png" alt="HoTok Logo">
        </div>
        <h1 id="title">Запуск HoTok...</h1>
        <p id="desc">Нажмите кнопку «Поделиться» в Safari и выберите «На экран "Домой"», чтобы установить мод.</p>
        <div class="loader" id="loader"></div>
    </div>

    <script>
        // Проверяем, запущено ли как PWA-приложение с рабочего стола
        const isPWA = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

        if (isPWA) {
            // Если это приложение с рабочего стола: включаем лоадер и мгновенно уводим в TikTok
            document.getElementById('title').innerText = 'Загрузка ленты...';
            document.getElementById('desc').innerText = 'Создаем безопасное подключение';
            document.getElementById('loader').style.display = 'block';
            
            setTimeout(() => {
                window.location.href = "https://tiktok.com";
            }, 1000);
        } else {
            // Если открыли просто как сайт в браузере: меняем текст на инструкцию
            document.getElementById('title').innerText = 'Установка HoTok 🐹';
        }
    </script>
</body>
</html>
